version: '3.8'

services:
  loot-bot:
    build: .
    container_name: loot0800_bot
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - loot_data:/app/data
    environment:
      - NODE_ENV=production
      - PUBLIC_URL=https://loot.servidor.xyz.br
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PORT=${PORT:-3000}

volumes:
  loot_data:
