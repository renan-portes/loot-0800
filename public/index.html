<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loot 0800 🎮 | Configuração de Alertas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0d17 0%, #111428 50%, #0d111e 100%);
      --card-bg: rgba(22, 27, 46, 0.75);
      --card-border: rgba(124, 58, 237, 0.25);
      --card-hover-border: rgba(6, 182, 212, 0.6);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --btn-gradient: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      --btn-hover: linear-gradient(135deg, #6d28d9 0%, #1d4ed8 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(124, 58, 237, 0.15);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a78bfa 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .user-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      color: #c4b5fd;
      margin-top: 14px;
    }

    .user-badge strong {
      color: #fff;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quick-actions {
      font-size: 12px;
      color: var(--accent-cyan);
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      font-family: inherit;
    }

    .stores-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .store-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 14px 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .store-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--card-hover-border);
      transform: translateX(2px);
    }

    .store-item.checked {
      background: rgba(124, 58, 237, 0.12);
      border-color: rgba(139, 92, 246, 0.5);
    }

    .store-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .store-icon {
      font-size: 22px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .store-details h4 {
      font-size: 15px;
      font-weight: 600;
      color: #f9fafb;
    }

    .store-details p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Custom Switch / Checkbox */
    .checkbox-wrapper {
      position: relative;
      width: 22px;
      height: 22px;
    }

    .checkbox-wrapper input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .custom-check {
      width: 22px;
      height: 22px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .checkbox-wrapper input:checked + .custom-check {
      background: var(--accent-purple);
      border-color: var(--accent-purple);
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
    }

    .custom-check::after {
      content: '✓';
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      display: none;
    }

    .checkbox-wrapper input:checked + .custom-check::after {
      display: block;
    }

    .btn-save {
      width: 100%;
      background: var(--btn-gradient);
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 15px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.35);
    }

    .btn-save:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.45);
    }

    .btn-save:active {
      transform: translateY(1px);
    }

    .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      margin-top: 18px;
      display: none;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    .alert.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .footer-note {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">🎮 Loot 0800</div>
      <p class="subtitle">Personalize seu radar e receba apenas os drops que você quer!</p>
      
      <div class="user-badge" id="chatIdBadge">
        <span>👤 Chat ID:</span> <strong id="displayChatId">Detectando...</strong>
      </div>
    </div>

    <div class="section-title">
      <span>Lojas Monitoradas</span>
      <button type="button" class="quick-actions" id="toggleAllBtn">Marcar Todas</button>
    </div>

    <form id="preferencesForm">
      <div class="stores-list">
        
        <!-- Epic Games -->
        <label class="store-item" for="chk-epic">
          <div class="store-info">
            <div class="store-icon">🟣</div>
            <div class="store-details">
              <h4>Epic Games Store</h4>
              <p>Jogos gratuitos semanais e lançamentos</p>
            </div>
          </div>
          <div class="checkbox-wrapper">
            <input type="checkbox" id="chk-epic" value="epic" />
            <div class="custom-check"></div>
          </div>
        </label>

        <!-- Steam -->
        <label class="store-item" for="chk-steam">
          <div class="store-info">
            <div class="store-icon">🔵</div>
            <div class="store-details">
              <h4>Steam</h4>
              <p>Giveaways, fins de semana e 100% OFF</p>
            </div>
          </div>
          <div class="checkbox-wrapper">
            <input type="checkbox" id="chk-steam" value="steam" />
            <div class="custom-check"></div>
          </div>
        </label>

        <!-- GOG -->
        <label class="store-item" for="chk-gog">
          <div class="store-info">
            <div class="store-icon">👾</div>
            <div class="store-details">
              <h4>GOG.com</h4>
              <p>Jogos clássicos e sem DRM</p>
            </div>
          </div>
          <div class="checkbox-wrapper">
            <input type="checkbox" id="chk-gog" value="gog" />
            <div class="custom-check"></div>
          </div>
        </label>

        <!-- Amazon Prime -->
        <label class="store-item" for="chk-amazon">
          <div class="store-info">
            <div class="store-icon">📦</div>
            <div class="store-details">
              <h4>Amazon Prime Gaming</h4>
              <p>Drops e chaves exclusivas de assinante</p>
            </div>
          </div>
          <div class="checkbox-wrapper">
            <input type="checkbox" id="chk-amazon" value="amazon" />
            <div class="custom-check"></div>
          </div>
        </label>

        <!-- Itch.io -->
        <label class="store-item" for="chk-itch">
          <div class="store-info">
            <div class="store-icon">🕹️</div>
            <div class="store-details">
              <h4>Itch.io</h4>
              <p>Jogos indie, experimentais e originais</p>
            </div>
          </div>
          <div class="checkbox-wrapper">
            <input type="checkbox" id="chk-itch" value="itch" />
            <div class="custom-check"></div>
          </div>
        </label>

      </div>

      <button type="submit" class="btn-save" id="saveBtn">
        💾 Salvar Preferências
      </button>

      <div class="alert" id="statusAlert"></div>
    </form>

    <div class="footer-note">
      ⚡ As alterações passam a valer imediatamente no seu bot Telegram!
    </div>
  </div>

  <script>
    // 1. Obter o chatId da URL (?chatId=12345)
    const urlParams = new URLSearchParams(window.location.search);
    const chatId = urlParams.get('chatId');

    const displayChatId = document.getElementById('displayChatId');
    const chatIdBadge = document.getElementById('chatIdBadge');
    const form = document.getElementById('preferencesForm');
    const statusAlert = document.getElementById('statusAlert');
    const saveBtn = document.getElementById('saveBtn');
    const toggleAllBtn = document.getElementById('toggleAllBtn');
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');

    if (!chatId) {
      displayChatId.textContent = 'Não informado (abra pelo bot /config)';
      chatIdBadge.style.borderColor = 'rgba(239, 68, 68, 0.5)';
      chatIdBadge.style.color = '#fca5a5';
    } else {
      displayChatId.textContent = chatId;
    }

    // Estilizar itens ao marcar/desmarcar
    function syncItemStyles() {
      checkboxes.forEach(chk => {
        const parent = chk.closest('.store-item');
        if (chk.checked) {
          parent.classList.add('checked');
        } else {
          parent.classList.remove('checked');
        }
      });
    }

    checkboxes.forEach(chk => chk.addEventListener('change', syncItemStyles));

    // Marcar / Desmarcar todas
    toggleAllBtn.addEventListener('click', () => {
      const allChecked = Array.from(checkboxes).every(c => c.checked);
      checkboxes.forEach(c => c.checked = !allChecked);
      syncItemStyles();
      toggleAllBtn.textContent = allChecked ? 'Marcar Todas' : 'Desmarcar Todas';
    });

    // 2. Carregar preferências existentes se houver
    async function loadPreferences() {
      if (!chatId) {
        // Padrão: marcar as lojas mais comuns
        ['epic', 'steam', 'gog', 'amazon'].forEach(val => {
          const el = document.querySelector(`input[value="${val}"]`);
          if (el) el.checked = true;
        });
        syncItemStyles();
        return;
      }

      try {
        const res = await fetch(`/api/preferences?chatId=${encodeURIComponent(chatId)}`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.preferences)) {
            checkboxes.forEach(chk => {
              chk.checked = data.preferences.includes(chk.value);
            });
            syncItemStyles();
            return;
          }
        }
      } catch (err) {
        console.warn('Erro ao carregar preferências atuais:', err);
      }

      // Fallback padrão se não encontrar no banco
      ['epic', 'steam', 'gog', 'amazon'].forEach(val => {
        const el = document.querySelector(`input[value="${val}"]`);
        if (el) el.checked = true;
      });
      syncItemStyles();
    }

    // 3. Salvar preferências ao enviar o formulário
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusAlert.className = 'alert';
      statusAlert.style.display = 'none';

      if (!chatId) {
        statusAlert.className = 'alert error';
        statusAlert.textContent = '❌ Erro: Chat ID não informado na URL. Abra o link enviado pelo comando /config no Telegram.';
        return;
      }

      const selected = Array.from(checkboxes)
        .filter(c => c.checked)
        .map(c => c.value);

      if (selected.length === 0) {
        statusAlert.className = 'alert error';
        statusAlert.textContent = '⚠️ Selecione ao menos uma loja para receber alertas!';
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = '⏳ Salvando...';

      try {
        const response = await fetch('/api/preferences', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chatId: chatId,
            preferences: selected
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          statusAlert.className = 'alert success';
          statusAlert.textContent = '✅ Preferências salvas com sucesso! Seus alertas foram atualizados.';
        } else {
          throw new Error(result.error || 'Erro ao salvar preferências.');
        }
      } catch (err) {
        statusAlert.className = 'alert error';
        statusAlert.textContent = `❌ ${err.message || 'Erro de conexão com o servidor.'}`;
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 Salvar Preferências';
      }
    });

    loadPreferences();
  </script>
</body>
</html>
